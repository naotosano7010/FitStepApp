name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS
    runs-on: macos-latest

    steps:
      - name: 1. リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 2. Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Capacitor 依存パッケージのインストール
        run: npm install

      - name: 4. iOS プロジェクトの生成と同期
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 5. Xcode による無署名ビルド (.xcarchive)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 6. iPhone転送用 .ipa ファイルへパッケージング
        run: |
          mkdir -p Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r FitStep-unsigned.ipa Payload

      - name: 7. 完成した .ipa ファイルをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: FitStep-iOS-IPA
          path: FitStep-unsigned.ipaname: Build Unsigned iOS IPA

